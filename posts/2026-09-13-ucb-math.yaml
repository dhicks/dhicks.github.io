  id: ElliottTapestryValuesIntroduction2017
  abstract: The role of values in scientific research has become an important topic of discussion in both scholarly and popular debates. Pundits across the political spectrum worry that research on topics like climate change, evolutionary theory, vaccine safety, and genetically modified foods has become overly politicized. At the same time, it is clear that values play an important role in science by limiting unethical forms of research and by deciding what areas of research have the greatest relevance for society. Deciding how to distinguish legitimate and illegitimate influences of values in scientific research is a matter of vital importance. Recently, philosophers of science have written a great deal on this topic, but most of their work has been directed toward a scholarly audience. This book makes the contemporary philosophical literature on science and values accessible to a wide readership. It examines case studies from a variety of research areas, including climate science, anthropology, chemical risk assessment, ecology, neurobiology, biomedical research, and agriculture. These cases show that values have necessary roles to play in identifying research topics, choosing research questions, determining the aims of inquiry, responding to uncertainty, and deciding how to communicate information. Kevin Elliott focuses not just on describing roles for values but also on determining when their influences are actually appropriate. He emphasizes several conditions for incorporating values in a legitimate fashion, and highlights multiple strategies for fostering engagement between stakeholders so that value influences can be subjected to careful and critical scrutiny.
