  id: RothsteinUniversityCaliforniaAdmissions2026
  abstract: 'In 2020, the Regents of the University of California voted to stop considering SAT scores (or ACT scores) in undergraduate admissions. A group of UC faculty have recently signed open letters calling on the Regents to reverse this decision.UC’s renewed debate on the SAT follows decisions from a number of Ivy League institutions to return to requiring standardized test scores, after going “test optional” during the pandemic. UC, however, is a public institution, with a different mission from that of the Ivy League private universities. As the “About UC” page on the ucop.edu website describes it, “The University of California began more than 150 years ago with a simple but revolutionary idea: that college should be available to everyone. That same spirit still guides us today…We’re an engine of social and economic mobility for hundreds of thousands of students, and our research and innovation powers health care for all Californians.” As the Regents and other stakeholders consider the question of whether to bring back the SAT, they will need to do so in light of the UC’s unique role in the state.This document attempts to address a number of factual and interpretive issues about the role of SAT scores in college admissions, in general and specifically at the University of California. It takes the form of a series of frequently asked questions and answers. It may be updated as new questions arise or new evidence comes to light.'
